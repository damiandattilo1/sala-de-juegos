<div class="registro-container">
  <h2>Crear Cuenta</h2>
  <form (ngSubmit)="onSubmit()" #regForm="ngForm">
    <div class="form-group">
      <label for="nombre">Nombre</label>
      <input id="nombre" type="text" class="form-control" [(ngModel)]="nombre" name="nombre" placeholder="Tu nombre" required />
    </div>
    <div class="form-group">
      <label for="email">Email</label>
      <input id="email" type="email" class="form-control" [(ngModel)]="email" name="email" placeholder="correo@ejemplo.com" required />
    </div>
    <div class="form-group">
      <label for="password">Contraseña</label>
      <input id="password" type="password" class="form-control" [(ngModel)]="password" name="password" placeholder="Contraseña" required />
    </div>
    <div class="form-group">
      <label for="confirmPassword">Confirmar Contraseña</label>
      <input id="confirmPassword" type="password" class="form-control" [(ngModel)]="confirmPassword" name="confirmPassword" placeholder="Repetí la contraseña" required />
    </div>
    @if (error) { <p class="error-msg">{{ error }}</p> }
    @if (success) { <p class="success-msg">{{ success }}</p> }
    <button type="submit" class="btn-submit w-100">Registrarse</button>
  </form>
</div>
