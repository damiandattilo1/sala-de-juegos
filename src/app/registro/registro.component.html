<div class="registro-container animate-fade-in-up">
  <h2>Crear Cuenta</h2>
  <form (ngSubmit)="onSubmit()" #regForm="ngForm">
    <div class="form-group">
      <label for="nombre">Nombre</label>
      <input id="nombre" type="text" class="form-control" [(ngModel)]="nombre" name="nombre" placeholder="Tu nombre" required />
    </div>
    <div class="form-group">
      <label for="email">Email</label>
      <input id="email" type="email" class="form-control" [(ngModel)]="email" name="email" placeholder="correo@ejemplo.com" required />
    </div>
    <div class="form-group">
      <label for="password">Contraseña</label>
      <input id="password" type="password" class="form-control" [(ngModel)]="password" name="password" placeholder="Contraseña" required />
    </div>
    <div class="form-group">
      <label for="confirmPassword">Confirmar Contraseña</label>
      <input id="confirmPassword" type="password" class="form-control" [(ngModel)]="confirmPassword" name="confirmPassword" placeholder="Repetí la contraseña" required />
    </div>
    @if (error) { <p class="error-msg">{{ error }}</p> }
    @if (success) { <p class="success-msg">{{ success }}</p> }
    <button type="submit" class="btn-submit w-100">Registrarse</button>
  </form>
</div>
<div class="registro-container animate-fade-in-up">
  <h2>Crear Cuenta</h2>
  <form (ngSubmit)="onSubmit()" #regForm="ngForm">
    <div class="form-group">
      <label for="nombre">Nombre</label>
      <input id="nombre" type="text" class="form-control" [(ngModel)]="nombre" name="nombre" placeholder="Tu nombre" required />
    </div>
    <div class="form-group">
      <label for="apellido">Apellido</label>
      <input id="apellido" type="text" class="form-control" [(ngModel)]="apellido" name="apellido" placeholder="Tu apellido" required />
    </div>
    <div class="form-group">
      <label for="edad">Edad</label>
      <input id="edad" type="number" class="form-control" [(ngModel)]="edad" name="edad" placeholder="Tu edad" min="1" max="120" required />
    </div>
    <div class="form-group">
      <label for="email">Email</label>
      <input id="email" type="email" class="form-control" [(ngModel)]="email" name="email" placeholder="correo@ejemplo.com" required />
    </div>
    <div class="form-group">
      <label for="password">Contraseña</label>
      <input id="password" type="password" class="form-control" [(ngModel)]="password" name="password" placeholder="Contraseña" required />
    </div>
    <div class="form-group">
      <label for="confirmPassword">Confirmar Contraseña</label>
      <input id="confirmPassword" type="password" class="form-control" [(ngModel)]="confirmPassword" name="confirmPassword" placeholder="Repetí la contraseña" required />
    </div>
    @if (error) { <p class="error-msg">{{ error }}</p> }
    @if (success) { <p class="success-msg">{{ success }}</p> }
    <button type="submit" class="btn-submit w-100" [disabled]="loading">
      {{ loading ? 'Registrando...' : 'Registrarse' }}
    </button>
  </form>
</div>
