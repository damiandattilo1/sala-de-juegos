<header class="app-header">
  <h1 class="brand">
    <img src="assets/logo.png" alt="Logo Sala de Juegos" class="brand-logo" />
    <span>Sala de Juegos</span>
  </h1>
  <nav>
    @if (currentUser) {
      <button routerLink="/" [skipLocationChange]="true" class="nav-btn">Home</button>
      <button routerLink="/ahorcado" [skipLocationChange]="true" class="nav-btn">Ahorcado</button>
      <button routerLink="/mayor-menor" [skipLocationChange]="true" class="nav-btn">Mayor o Menor</button>
      <button routerLink="/preguntados" [skipLocationChange]="true" class="nav-btn">Preguntados</button>
      <button routerLink="/generala-simple" [skipLocationChange]="true" class="nav-btn">Generala</button>
      <button routerLink="/chat" [skipLocationChange]="true" class="nav-btn">Chat</button>
      <button routerLink="/resultados" [skipLocationChange]="true" class="nav-btn">Resultados</button>
      <button routerLink="/quien-soy" [skipLocationChange]="true" class="nav-btn">Quién Soy</button>
      <span class="user-email">{{ currentUser.email }}</span>
      <button (click)="logout()" class="nav-btn nav-btn-logout">Cerrar Sesión</button>
    } @else {
      <button routerLink="/" [skipLocationChange]="true" class="nav-btn">Home</button>
      <button routerLink="/ingresar" [skipLocationChange]="true" class="nav-btn">Login</button>
      <button routerLink="/registro" [skipLocationChange]="true" class="nav-btn">Registro</button>
      <button routerLink="/quien-soy" [skipLocationChange]="true" class="nav-btn">Quién Soy</button>
    }
  </nav>
</header>

<main [@routeAnimations]="prepareRoute(outlet)">
  <router-outlet #outlet="outlet"></router-outlet>
  <img src="assets/logo.png" alt="Logo Sala de Juegos" class="brand-logo bottom-logo" />
</main>
