<header class="app-header">
  <h1>Sala de Juegos 🎲</h1>
  <nav>
    @if (currentUser) {
      <button routerLink="home" class="nav-btn">Home</button>
      <button routerLink="quien-soy" class="nav-btn">Quién Soy</button>
      <span class="user-email">{{ currentUser.email }}</span>
      <button (click)="logout()" class="nav-btn nav-btn-logout">Cerrar Sesión</button>
    } @else {
      <button routerLink="login" class="nav-btn">Login</button>
      <button routerLink="registro" class="nav-btn">Registro</button>
      <button routerLink="quien-soy" class="nav-btn">Quién Soy</button>
    }
  </nav>
</header>

<main [@routeAnimations]="prepareRoute(outlet)">
  <router-outlet #outlet="outlet"></router-outlet>
</main>
