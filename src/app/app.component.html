<header class="app-header">
  <h1 class="brand">
    <img src="assets/logo.png" alt="Logo Sala de Juegos" class="brand-logo" />
    <span>Sala de Juegos</span>
  </h1>
  <nav>
    <button (click)="navigateSilently('/')" class="nav-btn">Home</button>
    <button (click)="navigateSilently('/ingresar')" class="nav-btn">Login</button>
    <button (click)="navigateSilently('/registro')" class="nav-btn">Registro</button>
    <button (click)="navigateSilently('/quien-soy')" class="nav-btn">Quién Soy</button>
  </nav>
</header>

<main [@routeAnimations]="prepareRoute(outlet)">
  <router-outlet #outlet="outlet"></router-outlet>
  <img src="assets/logo.png" alt="Logo Sala de Juegos" class="brand-logo bottom-logo" />
</main>
