<section class="chat-container animate-fade-in">
  <h2>Chat Global</h2>
  <p class="subtitle">Mensajes en tiempo real para toda la sala.</p>

  @if (error) {
    <p class="error-msg">{{ error }}</p>
  }

  <div class="chat-body" #chatBody>
    @if (loading) {
      <p class="loading">Cargando mensajes...</p>
    }

    @for (msg of messages; track msg.id) {
      <article class="message" [class.own-message]="isOwnMessage(msg)">
        <header>
          <strong>{{ msg.nombre || msg.email }}</strong>
          <span>{{ formatTime(msg.createdAt) }}</span>
        </header>
        <p>{{ msg.mensaje }}</p>
      </article>
    }
  </div>

  <form class="chat-form" (ngSubmit)="sendMessage()">
    <input
      type="text"
      name="message"
      [(ngModel)]="messageText"
      maxlength="250"
      placeholder="Escribí tu mensaje"
      autocomplete="off"
      required
    />
    <button type="submit" [disabled]="!messageText.trim()">Enviar</button>
  </form>
</section>
